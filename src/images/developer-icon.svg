<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- Background -->
  <rect width="80" height="80" rx="6" fill="#3a3a3a"/>
  <!-- Terminal window frame -->
  <rect x="10" y="14" width="60" height="52" rx="5" stroke="#e0e0e0" stroke-width="2.5" fill="none"/>
  <!-- Title bar separator -->
  <line x1="10" y1="28" x2="70" y2="28" stroke="#e0e0e0" stroke-width="1.5"/>
  <!-- Window buttons -->
  <circle cx="20" cy="21" r="2.5" fill="#e0e0e0"/>
  <circle cx="29" cy="21" r="2.5" fill="#e0e0e0"/>
  <circle cx="38" cy="21" r="2.5" fill="#e0e0e0"/>
  <!-- Chevron prompt > -->
  <polyline points="17,39 24,46 17,53" stroke="#e0e0e0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Command text lines -->
  <line x1="29" y1="46" x2="44" y2="46" stroke="#e0e0e0" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="29" y1="57" x2="58" y2="57" stroke="#e0e0e0" stroke-width="2.5" stroke-linecap="round"/>
</svg>
